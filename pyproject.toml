[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prior-auth-copilot"
version = "0.1.0"
description = "Multi-agent prior-authorization copilot — LangGraph + custom MCP server + tiered memory"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-google-genai>=2.0,<3.0",
    "langchain-huggingface>=0.1",
    "langchain-mcp-adapters>=0.1.10,<0.2",
    "mcp>=1.9,<2",
    "langmem>=0.0.20",
    "chromadb>=0.5,<0.7",
    "sentence-transformers>=3.0",
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "streamlit>=1.36",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24,<2", "pytest-mock>=3.14", "ruff>=0.6"]

[project.scripts]
pac = "pa_copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # chromadb 0.6.3 touches `.model_fields` on a pydantic instance from its own
    # `types.py`. `rag/index.py` registers these same two ignores at import for
    # the production (threaded) path; pytest resets `warnings.filters` per test,
    # so they must also live here to keep the suite pristine. Both are category +
    # module scoped — a non-chromadb deprecation anywhere else still fails.
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
    "ignore::DeprecationWarning:chromadb",
]
markers = ["slow: needs a model download or a live Gemini API key"]

[tool.ruff]
line-length = 100
target-version = "py311"
