[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prior-auth-copilot"
version = "0.1.0"
description = "Multi-agent prior-authorization copilot — LangGraph + custom MCP server + tiered memory"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-google-genai>=2.0,<3.0",
    "langchain-huggingface>=0.1",
    "langchain-mcp-adapters>=0.1.10,<0.2",
    "mcp>=1.9,<2",
    "langmem>=0.0.20",
    "chromadb>=0.6,<0.7",  # rag/index.py uses the 0.6 collection API + `where=` shorthand
    "sentence-transformers>=3.0",
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "streamlit>=1.36",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24,<2", "pytest-mock>=3.14", "ruff>=0.6", "grandalf>=0.8"]

[project.scripts]
pac = "pa_copilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # chromadb 0.6.3 touches `.model_fields` on a pydantic instance from its own
    # `types.py`. `rag/index.py` registers these same two ignores at import for
    # the production (threaded) path; pytest resets `warnings.filters` per test,
    # so they must also live here to keep the suite pristine. Both are category +
    # module scoped — a non-chromadb deprecation anywhere else still fails.
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
    "ignore::DeprecationWarning:chromadb",
    # langgraph.store.sqlite (base.py) stores created_at/updated_at/expires_at as
    # `datetime` objects and lets sqlite3 adapt them, which Python 3.12 flags via
    # the deprecated default datetime adapter. It is library-internal (our code
    # never registers an adapter); category + exact-module scoped so a datetime
    # adapter deprecation from anywhere else still fails the suite.
    "ignore::DeprecationWarning:langgraph.store.sqlite.base",
    # trustcall 0.0.39 (a langmem 0.0.30 dependency, imported at `import langmem`
    # time by pa_copilot.memory.tools) does `from langgraph.constants import Send`,
    # which langgraph 1.0.1 flags as moved to `langgraph.types`. Library-internal
    # (our own code never imports Send from langgraph.constants); category +
    # module scoped to the third-party import site so an unrelated deprecation
    # still fails the suite.
    "ignore::langgraph.warnings.LangGraphDeprecatedSinceV10:trustcall",
    # langgraph.prebuilt.create_react_agent (1.0.1) emits deprecation warnings
    # about AgentStatePydantic and create_react_agent being moved to
    # langchain.agents, which does not exist in this project's pinned
    # langchain==0.3.30 (verified 2026-09-11). We use the langgraph prebuilt
    # deliberately per docs/design.md. Message-scoped ignore (regex matching
    # "has been moved to.*langchain\.agents") to avoid shadowing the pre-existing
    # trustcall ignore above (which handles different langgraph deprecations).
    "ignore:.*has been moved to.*langchain\\.agents.*:langgraph.warnings.LangGraphDeprecatedSinceV10",
]
markers = ["slow: needs a model download or a live Gemini API key"]

[tool.ruff]
line-length = 100
target-version = "py311"
